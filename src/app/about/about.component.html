<section id="about" class="about" reveal="up" (revealed)="startCounters()">
  <div class="about__card">
    <div class="about__portrait">
      <img
        src="images/kenan-avatar.jfif"
        [alt]="'about.portraitAlt' | t"
        width="460"
        height="460"
        loading="lazy"
      />
    </div>

    <div class="about__content">
      <p class="about__eyebrow">{{ 'about.eyebrow' | t }}</p>
      <h2>{{ 'about.heading' | t }}</h2>
      <p class="about__bio">{{ 'about.bio' | t }}</p>

      <ul class="about__facts" [attr.aria-label]="'about.factsLabel' | t">
        @for (fact of facts; track fact) {
          <li><app-pixel-tag>{{ fact | t }}</app-pixel-tag></li>
        }
      </ul>

      <div class="about__stats" [attr.aria-label]="'about.statsLabel' | t">
        @for (stat of stats; track stat.labelKey) {
          <div class="about__stat">
            <strong>{{ stat.value }}{{ stat.suffix }}</strong>
            <span>{{ stat.labelKey | t }}</span>
          </div>
        }
      </div>

      <a pixelButton="secondary" class="about__cv" href="Kenan-CV.pdf" download>
        {{ 'about.cv' | t }}
      </a>
    </div>
  </div>
</section>
