<app-navbar />

<main class="app-shell">
  <router-outlet />
</main>

<button
  class="back-to-top"
  type="button"
  [class.back-to-top--visible]="showBackToTop"
  [attr.aria-hidden]="showBackToTop ? null : true"
  [attr.tabindex]="showBackToTop ? 0 : -1"
  [attr.aria-label]="'backToTop' | t"
  (click)="scrollToTop()"
>
  <span class="back-to-top__icon" aria-hidden="true">↑</span>
</button>
