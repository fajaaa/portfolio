<app-navbar />

<main class="app-shell">
  <router-outlet />
</main>

<app-toast-outlet />

<button
  pixelButton
  class="back-to-top"
  type="button"
  [class.back-to-top--visible]="showBackToTop()"
  [attr.inert]="showBackToTop() ? null : ''"
  [attr.aria-label]="'backToTop' | t"
  [attr.data-tooltip]="'backToTop' | t"
  (click)="scrollToTop()"
>
  <app-pixel-art class="back-to-top__icon" [sprite]="arrowUp" />
</button>
