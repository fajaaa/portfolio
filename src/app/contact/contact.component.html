<section class="contact" aria-labelledby="contact-heading">
  <header class="contact__header">
    <h2 id="contact-heading" class="contact__heading">{{ 'contact.heading' | t }}</h2>
  </header>

  <div class="contact__layout" reveal="up" [stagger]="120">
    <div class="contact__stage">
      <app-npc class="contact__npc" [talking]="talking()" />

      <app-dialog-box
        class="contact__dialog"
        speaker="KENAN"
        typewriter
        startWhenVisible
        [speed]="25"
        [text]="npcLine()"
        (done)="talking.set(false)"
      />
    </div>

    <app-save-point />
  </div>
</section>
