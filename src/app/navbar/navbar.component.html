<nav class="navbar" [attr.aria-label]="'nav.ariaLabel' | t">
  <a class="navbar__brand" [href]="hrefFor('home')" (click)="navigateTo('home', $event)">
    Kenan Fajic
  </a>

  <div class="navbar__links navbar__links--desktop">
    @for (item of navItems; track item.fragment) {
      <a
        class="navbar__link"
        [class.navbar__link--active]="activeSection === item.fragment"
        [attr.aria-current]="activeSection === item.fragment ? 'page' : null"
        [href]="hrefFor(item.fragment)"
        (click)="navigateTo(item.fragment, $event)"
      >
        {{ item.labelKey | t }}
      </a>
    }
  </div>

  <!-- Temporary language toggle; restyled with the HUD in Phase 3. -->
  <div class="navbar__lang" role="group" [attr.aria-label]="'nav.language.label' | t">
    @for (lang of langs; track lang; let last = $last) {
      <button
        class="navbar__lang-button"
        type="button"
        [class.navbar__lang-button--active]="i18n.lang() === lang"
        [attr.aria-pressed]="i18n.lang() === lang"
        [attr.aria-label]="langLabels[lang] | t"
        [attr.lang]="lang"
        (click)="i18n.setLang(lang)"
      >
        {{ lang.toUpperCase() }}
      </button>
      @if (!last) {
        <span class="navbar__lang-divider" aria-hidden="true">|</span>
      }
    }
  </div>

  <button
    class="navbar__toggle"
    type="button"
    [class.navbar__toggle--open]="isMenuOpen"
    [attr.aria-expanded]="isMenuOpen"
    aria-controls="mobile-navigation"
    [attr.aria-label]="'nav.toggleMenu' | t"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

@if (isMenuOpen) {
  <div
    id="mobile-navigation"
    class="navbar__mobile"
    animate.enter="navbar__mobile--enter"
    animate.leave="navbar__mobile--leave"
  >
    @for (item of navItems; track item.fragment) {
      <a
        class="navbar__mobile-link"
        [class.navbar__mobile-link--active]="activeSection === item.fragment"
        [attr.aria-current]="activeSection === item.fragment ? 'page' : null"
        [href]="hrefFor(item.fragment)"
        (click)="navigateTo(item.fragment, $event)"
      >
        {{ item.labelKey | t }}
      </a>
    }
  </div>
}
