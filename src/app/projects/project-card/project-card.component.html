<article
  class="project-card"
  [@cardHover]="hoverState"
  (mouseenter)="setHoverState('hover')"
  (mouseleave)="setHoverState('rest')"
  (focusin)="setHoverState('hover')"
  (focusout)="setHoverState('rest')"
>
  <div class="project-card__thumbnail">
    @if (project.imageUrl) {
      <img [src]="project.imageUrl" [alt]="project.title" loading="lazy" />
    } @else {
      <div class="project-card__placeholder" aria-hidden="true">
        <mat-icon>terminal</mat-icon>
      </div>
    }

    <div class="project-card__overlay" [@overlayReveal]="hoverState">
      <a mat-icon-button [href]="project.githubUrl" target="_blank" rel="noopener" [attr.aria-label]="project.title + ' GitHub repository'">
        <mat-icon>code</mat-icon>
      </a>
      @if (project.demoUrl !== project.githubUrl) {
        <a mat-icon-button [href]="project.demoUrl" target="_blank" rel="noopener" [attr.aria-label]="project.title + ' live demo'">
          <mat-icon>open_in_new</mat-icon>
        </a>
      }
    </div>
  </div>

  <div class="project-card__body">
    <h3>{{ project.title }}</h3>
    <p>{{ project.description }}</p>

    <mat-chip-set class="project-card__stack" aria-label="Technology stack">
      @for (tech of project.techStack; track tech) {
        <mat-chip>{{ tech }}</mat-chip>
      }
    </mat-chip-set>
  </div>
</article>
