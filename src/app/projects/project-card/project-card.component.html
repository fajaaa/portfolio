<article class="project-card">
  <div class="project-card__thumbnail">
    @if (project.imageUrl) {
      <img [src]="project.imageUrl" [alt]="project.title" loading="lazy" />
    } @else {
      <div class="project-card__placeholder" aria-hidden="true">&gt;_</div>
    }

    <div class="project-card__overlay">
      <a
        pixelButton="secondary"
        [href]="project.githubUrl"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="'projects.card.codeLabel' | t: { title: project.title }"
      >
        {{ 'projects.card.code' | t }}
      </a>
      @if (project.demoUrl !== project.githubUrl) {
        <a
          pixelButton
          [href]="project.demoUrl"
          target="_blank"
          rel="noopener"
          [attr.aria-label]="'projects.card.demoLabel' | t: { title: project.title }"
        >
          {{ 'projects.card.demo' | t }}
        </a>
      }
    </div>
  </div>

  <div class="project-card__body">
    <h3>{{ project.title }}</h3>
    <p>{{ description() }}</p>

    <ul class="project-card__stack" [attr.aria-label]="'projects.card.stackLabel' | t">
      @for (tech of project.techStack; track tech) {
        <li><app-pixel-tag>{{ tech }}</app-pixel-tag></li>
      }
    </ul>
  </div>
</article>
