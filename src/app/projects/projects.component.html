<section class="projects">
  <div class="projects__header">
    <p class="projects__eyebrow">{{ 'projects.eyebrow' | t }}</p>
    <h2>{{ 'projects.heading' | t }}</h2>
  </div>

  @if (projects$ | async; as projects) {
    @if (projects.length > 0) {
      <div class="projects__grid" reveal="up" [stagger]="120">
        @for (project of projects; track project.githubUrl) {
          <app-project-card class="projects__item" [project]="project" />
        }
      </div>
    } @else {
      <p class="projects__state">{{ 'projects.empty' | t }}</p>
    }
  } @else {
    <p class="projects__state">{{ 'projects.loading' | t }}</p>
  }
</section>
