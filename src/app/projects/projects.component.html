<section id="projects" class="projects">
  <div class="projects__header">
    <p class="projects__eyebrow">Selected Work</p>
    <h2>My Projects</h2>
  </div>

  @if (projects$ | async; as projects) {
    @if (projects.length > 0) {
      <div class="projects__grid" reveal="up" [stagger]="120">
        @for (project of projects; track project.githubUrl) {
          <app-project-card class="projects__item" [project]="project" />
        }
      </div>
    } @else {
      <p class="projects__state">No public GitHub repositories found.</p>
    }
  } @else {
    <p class="projects__state">Loading GitHub projects...</p>
  }
</section>
