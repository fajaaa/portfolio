@for (bag of bags(); track bag.id; let i = $index) {
  @let selected = bag.id === active();
  <button
    #tab
    type="button"
    role="tab"
    class="tabs__tab"
    [attr.data-bag]="bag.id"
    [id]="tabId(bag.id)"
    [attr.aria-controls]="panelId()"
    [attr.aria-selected]="selected"
    [tabindex]="selected ? 0 : -1"
    (click)="selectBag.emit(bag.id)"
    (keydown)="onKeydown($event, i)"
  >
    <app-pixel-art class="tabs__bag" [sprite]="bagIcon" />
    <span class="tabs__name">{{ bag.bagKey | t }}</span>
    <span class="tabs__count" aria-hidden="true">{{ sizes()[bag.id] }}/{{ capacity() }}</span>
  </button>
}
