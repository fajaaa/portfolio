<section id="skills" class="skills">
  <div class="skills__header" reveal="up">
    <p class="skills__eyebrow">Technical Stack</p>
    <h2>Skills</h2>
  </div>

  <div class="skills__grid" aria-label="Skill categories" reveal="up" [stagger]="120">
    @for (category of categories; track category.title) {
      <article class="skills__card">
        <div class="skills__card-heading">
          <h3>{{ category.title }}</h3>
          <p>{{ category.summary }}</p>
        </div>

        <ul class="skills__list">
          @for (skill of category.skills; track skill) {
            <li class="skills__tile">{{ skill }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
